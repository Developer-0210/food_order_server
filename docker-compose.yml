version: "3.9"

services:
  backend:
    build: .
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    env_file:
      - .env   # load all variables from .env
    depends_on:
      - db
    command: ./start.sh   # ensure compose uses the script

  db:
    image: postgres:15
    container_name: fastapi_db
    restart: always
    env_file:
      - .env   # load DB credentials from .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
